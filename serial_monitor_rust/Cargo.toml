[package]
name = "serial_monitor_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "serial_monitor"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
once_cell = "1.19"
parking_lot = "0.12"
# Use ilhook which works on stable Rust, unlike retour which requires nightly
ilhook = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
